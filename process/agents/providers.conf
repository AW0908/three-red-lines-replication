# Central provider policy. Environment overrides take precedence; no credentials here.
# PI role assignment of 13.11.2026 (evening): Co-PI Claude Opus, worker Codex,
# reviewers data=Codex, estimation=Claude Opus, consistency=Codex, language=Claude Sonnet.
# Switch any role with an environment variable, e.g. MTPA_REVIEWER_ESTIMATION_PROVIDER=codex,
# or permanently by editing the value below. Valid: codex, claude, agy (alias antigravity).
: "${MTPA_DEFAULT_PROVIDER:=codex}"
: "${MTPA_WORKER_PROVIDER:=codex}"
: "${MTPA_CO_PI_PROVIDER:=claude}"
: "${MTPA_REVIEWER_PROVIDER:=}"
: "${MTPA_REVIEWER_DATA_PROVIDER:=codex}"
: "${MTPA_REVIEWER_ESTIMATION_PROVIDER:=claude}"
: "${MTPA_REVIEWER_CONSISTENCY_PROVIDER:=codex}"
: "${MTPA_REVIEWER_LANGUAGE_PROVIDER:=claude}"
# Optional provider-native model names; empty means provider's configured default.
: "${MTPA_CODEX_MODEL:=}"
: "${MTPA_CLAUDE_MODEL:=}"
: "${MTPA_AGY_MODEL:=}"
# Optional role- AND provider-specific model names (MTPA_<ROLE>_<PROVIDER>_MODEL).
# They apply only when that role actually runs on that provider, so switching a role to
# another provider never passes a foreign model name. Precedence: role/provider model >
# provider model above > CLI default. Roles: WORKER, CO_PI, REVIEWER_DATA,
# REVIEWER_ESTIMATION, REVIEWER_CONSISTENCY, REVIEWER_LANGUAGE, REVIEWER_GENERAL.
: "${MTPA_CO_PI_CLAUDE_MODEL:=opus}"
: "${MTPA_REVIEWER_ESTIMATION_CLAUDE_MODEL:=opus}"
: "${MTPA_REVIEWER_LANGUAGE_CLAUDE_MODEL:=sonnet}"
